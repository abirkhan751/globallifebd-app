name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build GlobalLifeBD APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'


      - name: Build Android APK
        run: |
          gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace

      - name: Prepare APK for Download
        run: |
          mkdir -p final-apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp "{}" "final-apk/GLOBAL LIFE BD.apk" \;
          cp "final-apk/GLOBAL LIFE BD.apk" "final-apk/GlobalLifeBD-App.apk"
          echo "APK build complete. File details:"
          ls -lh final-apk/
          apksigner verify --verbose "final-apk/GLOBAL LIFE BD.apk" || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLOBAL-LIFE-BD-APK
          path: final-apk/
          retention-days: 30

      - name: Create or Update GitHub Release v2.0.4
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.4
          name: "GLOBAL LIFE BD Version 2.0.4"
          body: |
            ### GLOBAL LIFE BD Version 2.0.4 Official Release
            - App Version: Version 2.0.4 (versionCode 18)
            - Automated push notification title de-duplication
            - Vendor order receive push notification support
            - Pure white website logo small notification icon with orange background
            - Lock screen wake-up on push arrival
          draft: false
          prerelease: false
          files: |
            final-apk/GLOBAL LIFE BD.apk
            final-apk/GlobalLifeBD-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "GLOBAL LIFE BD (Latest)"
          body: "Official Android Application for GLOBAL LIFE BD Version 2.0.4."
          draft: false
          prerelease: false
          files: |
            final-apk/GLOBAL LIFE BD.apk
            final-apk/GlobalLifeBD-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
