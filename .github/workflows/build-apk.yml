name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build GlobalLifeBD APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android APK
        run: |
          gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace

      - name: Prepare APK for Download
        run: |
          mkdir -p final-apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp "{}" "final-apk/GLOBAL LIFE BD.apk" \;
          cp "final-apk/GLOBAL LIFE BD.apk" "final-apk/GlobalLifeBD-App.apk"
          echo "APK build complete. File details:"
          ls -lh final-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLOBAL-LIFE-BD-APK
          path: final-apk/
          retention-days: 30

      - name: Create or Update GitHub Release v1.0.3
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "GLOBAL LIFE BD v1.0.3"
          body: |
            ### GLOBAL LIFE BD v1.0.3 Official Release
            - App Version: 1.0.3 (versionCode 4)
            - Official Firebase Integration (google-services.json)
            - Instant Push Notifications on device installation
            - Real-time income push notifications matching website browser alerts
            - 0-second real-time admin sidebar counts update
          draft: false
          prerelease: false
          files: |
            final-apk/GLOBAL LIFE BD.apk
            final-apk/GlobalLifeBD-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "GLOBAL LIFE BD (Latest)"
          body: "Official Android Application for GLOBAL LIFE BD v1.0.3."
          draft: false
          prerelease: false
          files: |
            final-apk/GLOBAL LIFE BD.apk
            final-apk/GlobalLifeBD-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
