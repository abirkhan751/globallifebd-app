name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build GlobalLifeBD APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android APK
        run: |
          gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace

      - name: Prepare APK for Download
        run: |
          mkdir -p final-apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp "{}" "final-apk/GLOBAL LIFE BD.apk" \;
          cp "final-apk/GLOBAL LIFE BD.apk" "final-apk/GlobalLifeBD-App.apk"
          echo "APK build complete. File details:"
          ls -lh final-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLOBAL-LIFE-BD-APK
          path: final-apk/
          retention-days: 30

      - name: Create or Update GitHub Release v1.0.8
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.8
          name: "GLOBAL LIFE BD v1.0.8"
          body: |
            ### GLOBAL LIFE BD v1.0.8 Official Release
            - App Version: 1.0.8 (versionCode 10)
            - Modern Android Adaptive Icons (API 26+) for crisp, un-shrunk home screen icons with brand orange bleed
            - Smooth spring entrance & breathing logo animation on app launch
            - Razor-sharp splash and offline screen branding
            - Single optimized upload image processing (0 duplicate webp files)
            - PWA and Add to Home Screen Web Install manifest & apple touch icons
            - Notification, Camera & Storage unified permission prompts
            - Official Firebase Push Notifications Integration
          draft: false
          prerelease: false
          files: |
            final-apk/GLOBAL LIFE BD.apk
            final-apk/GlobalLifeBD-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "GLOBAL LIFE BD (Latest)"
          body: "Official Android Application for GLOBAL LIFE BD v1.0.8."
          draft: false
          prerelease: false
          files: |
            final-apk/GLOBAL LIFE BD.apk
            final-apk/GlobalLifeBD-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
